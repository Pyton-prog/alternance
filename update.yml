name: Mise à jour des offres
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_offers.py
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
      - run: |
          git config user.name "offers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/offers.json
          git commit -m "Mise à jour des offres" || exit 0
          git push
