<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrouveMonAlternance</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#3b5bdb;--ok:#2f9e44;--bd:#e2e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e27;--tx:#eceff5;--mut:#98a2b3;--ac:#7c93ff;--ok:#51cf66;--bd:#2c303c}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0}h2{font-size:1.1rem;margin:0 0 8px}
.s{color:var(--mut);margin:0 0 12px;font-size:.9rem}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:4px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.tag{font-size:.78rem;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:1px 8px}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.offer{border-top:1px solid var(--bd);padding:12px 0}
.offer b{display:block}.offer a{color:var(--ac);text-decoration:none;font-size:.9rem}
.offer .m{color:var(--mut);font-size:.85rem}
.offer .chips{margin-top:6px;gap:4px}
#more{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>🎓 TrouveMonAlternance</h1>
<p class="s" id="upd">Chargement des offres…</p>

<section>
  <label for="dom">Domaine</label>
  <select id="dom"></select>
  <label for="job">Alternance recherchée</label>
  <input id="job" list="jobs" placeholder="ex : ingénieur chimie, data analyst, comptable…" autocomplete="off">
  <datalist id="jobs"></datalist>
  <label for="ville">Ville ou département (optionnel)</label>
  <input id="ville" placeholder="ex : Lyon, 69, Île-de-France">
</section>

<section id="skillsec" hidden>
  <h2>Compétences demandées</h2>
  <p class="s" id="skinfo"></p>
  <p><b id="pct"></b></p>
  <div class="bar"><i id="barfill"></i></div>
  <div class="chips" id="sk"></div>
  <p class="s" style="margin-top:10px">Touche une compétence que tu maîtrises pour calculer ta compatibilité.</p>
</section>

<section>
  <h2 id="ot">Offres</h2>
  <div id="offers"></div>
  <button id="more" hidden>Voir plus</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const nrm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let DOM=[],OFF=[],hits=[],shown=0,top=[];
let mine=new Set();
try{mine=new Set(JSON.parse(localStorage.getItem("skills")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("skills",JSON.stringify([...mine]))}catch(e){}};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function init(){
  try{
    const [d,o]=await Promise.all([fetch("domains.json").then(r=>r.json()),fetch("data/offers.json").then(r=>r.json())]);
    DOM=d;OFF=o.offers.map(x=>({...x,n:nrm(x.t+" "+x.x+" "+x.s.join(" ")),tn:nrm(x.t),ln:nrm(x.l)}));
    $("dom").innerHTML='<option value="">Tous les domaines</option>'+DOM.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join("");
    $("upd").textContent=OFF.length?`${OFF.length} offres d’alternance réelles · mise à jour le ${o.updated}`:"Aucune offre chargée : lance d’abord le workflow « Mise à jour des offres » (voir README).";
    suggest();run();
  }catch(e){$("upd").textContent="Impossible de charger les données. Ouvre le site via GitHub Pages (pas en double-cliquant sur le fichier).";}
}
function suggest(){
  const ds=$("dom").value?DOM.filter(x=>x.id===$("dom").value):DOM;
  $("jobs").innerHTML=ds.flatMap(x=>x.q).map(q=>`<option value="${esc(q)}">`).join("");
}
function run(){
  const d=$("dom").value,v=nrm($("ville").value.trim()),toks=nrm($("job").value).split(/\s+/).filter(Boolean);
  hits=OFF.filter(o=>(!d||o.g===d)&&(!v||o.ln.includes(v))&&toks.every(t=>o.n.includes(t)))
          .sort((a,b)=>b.d.localeCompare(a.d));
  const cnt={};hits.forEach(o=>o.s.forEach(s=>cnt[s]=(cnt[s]||0)+1));
  top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,18);
  $("skillsec").hidden=!hits.length;
  $("skinfo").textContent=`Calculé sur ${hits.length} offre${hits.length>1?"s":""} réelle${hits.length>1?"s":""}.`;
  drawSkills();
  $("ot").textContent=`Offres (${hits.length})`;
  $("offers").innerHTML="";shown=0;more();
  if(!hits.length&&OFF.length)$("offers").innerHTML='<p class="s">Aucune offre trouvée. Essaie des mots plus larges ou une autre ville.</p>';
}
function drawSkills(){
  $("sk").innerHTML=top.map(([s,n])=>`<button class="chip ${mine.has(s)?"on":""}" data-s="${esc(s)}">${esc(s)}<small>${Math.round(n/hits.length*100)} %</small></button>`).join("");
  const t=top.slice(0,10),ok=t.filter(([s])=>mine.has(s)).length;
  const p=t.length?Math.round(ok/t.length*100):0;
  $("pct").textContent=`Compatibilité sur les 10 compétences principales : ${p} %`;
  $("barfill").style.width=p+"%";
}
function more(){
  const part=hits.slice(shown,shown+20);shown+=part.length;
  $("offers").insertAdjacentHTML("beforeend",part.map(o=>`<div class="offer">
    <b>${esc(o.t)}</b>
    <div class="m">${esc(o.c||"Entreprise non précisée")} · ${esc(o.l)} · ${esc(o.d)}</div>
    <div class="chips">${o.s.slice(0,6).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>
    <a href="${esc(o.u)}" target="_blank" rel="noopener">Voir l’offre et postuler ↗</a></div>`).join(""));
  $("more").hidden=shown>=hits.length;
}
$("sk").onclick=e=>{const b=e.target.closest("button");if(!b)return;const s=b.dataset.s;
  mine.has(s)?mine.delete(s):mine.add(s);save();drawSkills();};
$("more").onclick=more;
$("dom").onchange=()=>{suggest();run()};
$("job").oninput=run;$("ville").oninput=run;
init();
</script>
</body>
</html>
